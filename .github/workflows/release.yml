name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/src-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Check release marker
        id: check
        run: |
          MESSAGE=$(git log -1 --pretty=%B)
          echo "Commit message: $MESSAGE"
          if [[ "$MESSAGE" == *"[release]"* ]]; then
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "✅ Release commit detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "should-release=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipped - not a release commit" >> $GITHUB_STEP_SUMMARY
            echo "Commit message was: $MESSAGE"
          fi

      - name: Get version
        if: steps.check.outputs.should-release == 'true'
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION" >> $GITHUB_STEP_SUMMARY

      - name: Setup Bun
        if: steps.check.outputs.should-release == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Setup Node.js
        if: steps.check.outputs.should-release == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Read npm and GitHub publication state
        if: steps.check.outputs.should-release == 'true'
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          async function exists(url, headers = {}) {
            const response = await fetch(url, { headers, signal: AbortSignal.timeout(30000) });
            if (response.status === 404) return false;
            if (!response.ok) throw new Error(`Publication lookup failed: HTTP ${response.status}`);
            return true;
          }
          const npm = await exists(`https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${encodeURIComponent(pkg.version)}`);
          const github = await exists(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/v${encodeURIComponent(pkg.version)}`, {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json'
          });
          appendFileSync(process.env.GITHUB_OUTPUT, `npm=${npm}\ngithub=${github}\n`);
          NODE

      - name: Cache dependencies
        if: steps.check.outputs.should-release == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        if: steps.check.outputs.should-release == 'true'
        run: bun install --frozen-lockfile

      - name: Build
        if: steps.check.outputs.should-release == 'true'
        run: bun run build

      - name: Verify published package
        if: steps.check.outputs.should-release == 'true'
        run: bun run pack:verify

      - name: Validate changelog entry
        if: steps.check.outputs.should-release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const version = process.env.RELEASE_VERSION;
          if (!version) throw new Error('Release version is missing');
          const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const heading = new RegExp(`^##\\s+(?:${escaped}|\\[${escaped}\\])(?:\\([^\\n]*\\))?(?:\\s|$)`, 'm');
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          if (!heading.test(changelog)) {
            throw new Error(`CHANGELOG.md has no reviewed entry for v${version}. Ask the AI to update it before releasing.`);
          }
          console.log(`CHANGELOG.md contains the reviewed v${version} entry.`);
          NODE

      - name: Extract release notes
        if: steps.check.outputs.should-release == 'true' && steps.published.outputs.github == 'false'
        id: notes
        run: |
          # Extract content between first and second version headers
          # Handles both "## [1.0.0]" and "## 1.0.0" formats
          NOTES=$(awk '
            /^## \[?[0-9]+\.[0-9]+\.[0-9]+\]?/ {
              if (found) exit
              found = 1
              next
            }
            found { print }
          ' CHANGELOG.md)

          # Remove empty lines at start and end
          NOTES=$(echo "$NOTES" | sed '/^[[:space:]]*$/d')

          # Fallback if empty
          if [ -z "$NOTES" ]; then
            NOTES="Version bump release."
          fi

          # Output using heredoc for multiline
          {
            echo "content<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> $GITHUB_OUTPUT

      - name: Publish to npm
        if: steps.check.outputs.should-release == 'true' && steps.published.outputs.npm == 'false'
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        if: steps.check.outputs.should-release == 'true' && steps.published.outputs.github == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.content }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}

      - name: Release summary
        if: steps.check.outputs.should-release == 'true'
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚀 Released v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Link |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release | [v${{ steps.version.outputs.version }}](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| npm Package | [src-mcp](https://www.npmjs.com/package/src-mcp) |" >> $GITHUB_STEP_SUMMARY
